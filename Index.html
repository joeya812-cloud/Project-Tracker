<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Controls Install Tracker</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

#np{width:auto;padding:10px 16px}
.top[hidden]{display:none}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}

.stats b{color:var(--ink)}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
form .full{grid-column:1/-1}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;width:100%}
button{cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.top button{width:auto;white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}

.col h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.col h2 span.dot{width:10px;height:10px;border-radius:50%}

.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);margin-top:4px}
.pri{font-weight:600}
.overdue{color:var(--hi);font-weight:600}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{width:auto;padding:4px 10px;font-size:.82rem}
.empty{color:var(--mute);font-size:.9rem;padding:8px 2px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--mute);margin-bottom:16px}
.ro form{display:none}
.bt{font-size:1.2rem;margin:0 0 10px}
#cm{margin-top:22px}#cmt{font:inherit;line-height:1.4;resize:vertical;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.cmt{padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}.cmt small,.cmi small{color:var(--mute)}.cmt button{width:auto;padding:2px 8px;font-size:.8rem;margin-top:4px;display:block}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.9rem;margin-bottom:14px}
.tbl th,.tbl td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{font-weight:700;border-bottom:0}
.tw{overflow-x:auto}
.cl{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.cl button{width:auto;padding:2px 8px;font-size:.8rem}

</head>

<div id="dbody"></div></div>

<div id="bv">
<h2 id="bt" class="bt"></h2>

<div class="bar" id="bar" aria-hidden="true"></div>
<div class="stats" id="stats"></div>
<form id="f">

<input class="full" id="eq" placeholder="Equipment or area, e.g. AHU-3 (optional)" aria-label="Equipment or area" maxlength="60" hidden>
<select id="fp" aria-label="Project for new task"></select>
<select id="fo" aria-label="Assignee"></select>
<select id="fs" aria-label="System"></select>
<select id="fh" aria-label="Phase"></select>
<input id="due" type="date" aria-label="Due date">
<select id="pri" aria-label="Priority"><option value="2">Medium priority</option><option value="3">High priority</option><option value="1">Low priority</option></select>
<button class="primary full" type="submit">Add task</button>
</form>
<div class="ph" id="ph"></div>
<div class="filters" id="filters"></div>
<div class="board" id="board"></div>
<div id="cs" hidden><h2 class="bt">Costs</h2><form id="cf"><select id="ck" aria-label="Type"><option value="m">Material</option><option value="l">Labor</option></select><input id="cd" placeholder="Item, e.g. DDC controllers or install labor" required maxlength="100" aria-label="Item"><input id="cc" type="number" min="0" step="0.01" placeholder="Cost" required aria-label="Cost"><input id="cp" type="number" min="0" step="0.01" placeholder="Sell price" required aria-label="Sell price"><input id="ch" type="number" min="0" step="0.25" placeholder="Labor hours" aria-label="Labor hours" hidden><button class="primary full" type="submit">Add line</button></form><div id="cout"></div></div>

<div id="cm" hidden><h2 class="bt">Comments</h2><form id="cmf"><textarea id="cmt" class="full" rows="2" maxlength="1000" placeholder="Add a comment on this project" required aria-label="Comment"></textarea><button class="primary full" type="submit">Post comment</button></form><div id="cml"></div></div>
</div>

</main>
